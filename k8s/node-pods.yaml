apiVersion: apps/v1
kind: Deployment
metadata:
  name: idss-nodes
  labels:
    app: idss
    tier: idss-nodes
spec:
  replicas: 3
  selector:
    matchLabels:
      tier: idss-nodes
  template:
    metadata:
      labels:
        tier: idss-nodes
    spec:
      containers:
        - name: idss
          image: ghcr.io/pulihub/idss:latest
          imagePullPolicy: Always
          env:
            - name: IDSS_BOOTSTRAP_IP
              value: "10.10.5.20"
            - name: IDSS_PORT
              value: "19000"
            - name: IDSS_NR
              value: "10"
          volumeMounts:
            - name: cert
              mountPath: "/certs"
              readOnly: true
      volumes:
        - name: cert
          secret:
            secretName: idsscerts
