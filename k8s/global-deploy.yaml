apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: idssnode
spec:
  serviceName: idss-network
  replicas: 3
  podManagementPolicy: OrderedReady   # ⚠️ peer-0 parte PRIMA degli altri
  selector:
    matchLabels:
      app: idss
  template:
    metadata:
      labels:
        app: idss
    spec:
      initContainers:
      # Aspetta che peer-0 sia pronto prima di unirsi alla rete
      - name: wait-for-bootstrap
        image: busybox:1.36
        command:
        - sh
        - -c
        - |
          # peer-0 non aspetta se stesso
          if [ "$(POD_NAME)" = "idssnode-0" ]; then
            echo "I am bootstrap, skipping wait"
            exit 0
          fi
          echo "Waiting for bootstrap peer-0..."
          until nslookup idssnode-0.idss-network.$(NAMESPACE).svc.cluster.local; do
            sleep 2
          done
          echo "Bootstrap is up, joining network"
        env:
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
      containers:
      - name: idssnode
        image: ghcr.io/pulihub/idss:latest 
        command:
        - sh
        - -c
        - |
          sed -i "s/<Hostname>.*<\/Hostname>/<Hostname>"$(POD_NAME).idss-network.$(NAMESPACE).svc.cluster.local"<\/Hostname>/g" /etc/idss_conf.xml;
          python /datagen.py $IDSS_NR;
          cp /certs/* /usr/local/server
          cp /certs/* /usr/local/bin 
          cd /usr/local/server;
          if [ "$POD_NAME" = "idssnode-0" ]; then
            echo "Starting as BOOTSTRAP node"
            /usr/local/server/idss -p 19000  \
            -a $BOOTSTRAP_ADDR \
            -f /etc/idss_conf.xml \
            -d 2 \
            -e /usr/local/server/stderr \
            -l /usr/local/server/log \
            -o  19001 \
            -r 0.75;
            echo "Launched idss bootstrap node";
            tail -f /dev/null
          else
            echo "Starting as PEER, bootstrap=$BOOTSTRAP_ADDR"
            /usr/local/server/idss -p 19000  \
            -a $POD_IP \
            -f /etc/idss_conf.xml \
            -d 2 \
            -e /usr/local/server/stderr \
            -l /usr/local/server/log \
            -o  19001 \
            -j `dig +short $BOOTSTRAP_ADDR`:19001 \
            -r 0.75;
            echo "Launched peer $POD_NAME";
            tail -f /dev/null;
          fi
        ports:
        - containerPort: 19000
          protocol: TCP
        - containerPort: 19001
          protocol: UDP
        env:
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: BOOTSTRAP_ADDR
          value: "idssnode-0.idss-network.$(NAMESPACE).svc.cluster.local"
        - name: POD_IP
          valueFrom:
            fieldRef:
              fieldPath: status.podIP
#        resources:
#          requests:
#            cpu: "50m"
#            memory: "64Mi"
#          limits:
#            cpu: "200m"
#            memory: "128Mi"
#        readinessProbe:
#          tcpSocket:
#            port: 19000
#          initialDelaySeconds: 10
#          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: idss-network
spec:
  clusterIP: None
  selector:
    app: idss
  ports:
  - name: tcp
    port: 19000
    protocol: TCP
  - name: udp
    port: 19001
    protocol: UDP
